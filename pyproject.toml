[project]
name = "wizsprinter"
version = "0.5.5"
description = "A semi-official WizWalker extension"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
readme = "README.rst"
dependencies = [
    "lark>=1.1.9",
    "wizwalker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wizwalker"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    # Our wizwalker, at the commit BartleBot pins, rather than PyPI's; move it with
    # that pin. A dependency group, not [tool.uv.sources]: uv reads a git or path
    # dependency's sources too, and two pins of wizwalker then refuse to lock.
    "wizwalker @ git+https://github.com/BartleWorks/wizwalker.git@53929b787b60490158b9b8e6d8b67cffe0f8f2c8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
